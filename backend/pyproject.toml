[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-singer-backend"
version = "0.1.0"
description = "Minimal API foundation for the AI Singer project"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_singer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
